services:
  - type: web
    name: decision-graveyard
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: decision-graveyard-db
          property: connectionString
      - key: APP_TIMEZONE
        value: Asia/Makassar
      - key: SEED_DEMO
        value: "true"

databases:
  - name: decision-graveyard-db
    plan: free
    databaseName: decision_graveyard
    user: graveyard
